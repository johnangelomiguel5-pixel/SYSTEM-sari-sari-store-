<h1>Change Password</h1>
<h2>You will be signed out everywhere after changing it</h2>

<p class="message-box message-error">{{ERROR}}</p>

<form class="card-form" method="POST" action="/change-password">
  <label for="current_password">Current Password</label>
  <input type="password" id="current_password" name="current_password" autocomplete="current-password" maxlength="128" required />

  <label for="new_password">New Password</label>
  <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="16" maxlength="128" required />

  <label for="confirm_password">Confirm New Password</label>
  <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="16" maxlength="128" required />

  <ul class="pw-rules">
    <li>At least 16 characters</li>
    <li>An uppercase letter (A-Z) and a lowercase letter (a-z)</li>
    <li>A number (0-9)</li>
    <li>A special character such as ! @ # $ % ^ &amp; *</li>
  </ul>

  <div class="form-actions">
    <button type="submit">Change Password</button>
    <a class="btn btn-secondary" href="/">Cancel</a>
  </div>
</form>
