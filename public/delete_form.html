<h1>Delete Product</h1>
<h2>Delete one product by its ID. You will be asked to confirm.</h2>
<form class="card-form" method="POST" action="/delete">
  <label for="id">Enter Product ID</label>
  <input type="number" id="id" name="id" min="1" required />
  <div class="form-actions">
    <button type="submit" class="btn-danger">Delete Product</button>
  </div>
</form>
<p class="hint">
  To delete several products, or a whole category, use
  <a href="/products">View Products</a>.
</p>
<a class="back-link" href="/"><button type="button" class="btn-secondary">Return to Main Menu</button></a>
