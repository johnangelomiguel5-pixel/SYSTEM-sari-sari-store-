<h1>Update Stock</h1>
<h2>Change only the stock quantity. To change a name, price or category, use Edit.</h2>
<form class="card-form" method="POST" action="/update">
  <label for="id">Enter Product ID</label>
  <input type="number" id="id" name="id" min="1" required />
  <label for="stock">New Stock</label>
  <input type="number" id="stock" name="stock" min="0" required />
  <div class="form-actions">
    <button type="submit">Update Stock</button>
  </div>
</form>
<a class="back-link" href="/"><button type="button" class="btn-secondary">Return to Main Menu</button></a>
