<h1>Update Stock</h1>
<form method="POST" action="/update">
<label>Enter Product ID:</label><input type="number" name="id" required>
<label>New Stock:</label><input type="number" name="stock" min="0" required>
<button type="submit">Update Stock</button>
</form>
<a href="/"><button type="return">Return to Main Menu</button></a>
