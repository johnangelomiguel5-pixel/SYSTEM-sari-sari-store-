<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock History Report</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="pdf-page">

        <div class="pdf-container">

            <!-- PDF report icon -->
            <div class="pdf-icon">

                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.75"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
                    <path d="M14 2v6h6"/>
                    <path d="M8 13h8"/>
                    <path d="M8 17h6"/>

                </svg>

            </div>

            <!-- Page title -->
            <h1>Stock History Report</h1>

            <!-- Description -->
            <p>
                Your stock history PDF has been generated successfully.
            </p>

            <!-- Buttons -->
            <div class="pdf-buttons">

                <!-- Open PDF -->
                <a href="/stock_history_report.pdf"
                   class="pdf-button pdf-primary">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="18"
                         height="18"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <polyline points="9 15 12 12 15 15"/>

                    </svg>

                    Open PDF Report

                </a>

                <!-- Back to dashboard -->
                <a href="/"
                   class="pdf-button pdf-secondary">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="18"
                         height="18"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M19 12H5"/>
                        <polyline points="12 19 5 12 12 5"/>

                    </svg>

                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</body>

</html>
