<h1>Add Product</h1>
<h2>New items start with the stock you enter below</h2>

<form class="card-form" method="POST" action="/add">
  <label for="name">Product Name</label>
  <input type="text" id="name" name="name" maxlength="99" required />

  <label for="category">Category</label>
  <input type="text" id="category" name="category" maxlength="49" required />

  <label for="price">Price (&#8369;)</label>
  <input type="number" id="price" step="0.01" name="price" min="0" required />

  <label for="stock">Stock</label>
  <input type="number" id="stock" name="stock" min="0" required />

  <div class="form-actions">
    <button type="submit">Add Product</button>
  </div>
</form>

<a class="back-link" href="/">
  <button type="button" class="btn-secondary">Return to Main Menu</button>
</a>
