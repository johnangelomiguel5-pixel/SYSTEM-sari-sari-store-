<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>

    <!-- Manrope Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Menu button for small screens: a hidden checkbox + label, so the
           menu opens and closes with CSS only (no JavaScript). -->
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <header class="topbar">
        <label for="nav-toggle" class="nav-toggle-btn" aria-label="Open or close the menu">&#9776;</label>
        <span class="topbar-brand"><span class="brand-icon">S</span> Sari-Sari Store</span>
      </header>

      <aside class="sidebar">
        <div class="brand">
          <span class="brand-icon">S</span> Sari-Sari Store
        </div>
        <nav class="nav">
          <div class="navi"><a href="/">Dashboard</a></div>
          <div class="navi"><a href="/products">View Products</a></div>
          <div class="navi"><a href="/add">Add Product</a></div>
          <div class="navi"><a href="/low-stock">Low Stock</a></div>
          <div class="navi"><a href="/stock-history">Stock History</a></div>
          <div class="navi"><a href="/change-password">Change Password</a></div>
          <div class="navi"><a href="/logout">Log Out</a></div>
        </nav>
      </aside>

      <main class="content">{{BODY}}</main>
    </div>
  </body>
</html>
