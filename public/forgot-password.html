<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Forgot Password - Sari-Sari Store</title>

    <link rel="stylesheet" href="/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="login-page">
    <div class="login-container">
      <div class="login-brand">
        <div class="login-icon">S</div>

        <h1>Sari-Sari Store</h1>

        <p>Inventory Management System</p>
      </div>

      <div class="login-error">{{ERROR}}</div>
      <div class="login-notice">{{NOTICE}}</div>

      <form class="login-form" method="POST" action="/forgot-password">
        <label for="identifier">Username or email</label>

        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder="Enter your username or registered email"
          autocomplete="username"
          maxlength="200"
          required
        />

        <button type="submit" class="login-button">Send reset link</button>
      </form>

      <p class="hint center">
        We will email a one-time link to the address registered on the account.
      </p>

      <div class="center-links">
        <a href="/login">Back to Login</a>
      </div>

      <div class="login-footer">Password Recovery</div>
    </div>
  </body>
</html>
