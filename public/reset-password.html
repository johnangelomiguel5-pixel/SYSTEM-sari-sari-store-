<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - Sari-Sari Store</title>

    <link rel="stylesheet" href="/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="login-page">
    <div class="login-container">
      <div class="login-brand">
        <div class="login-icon">S</div>

        <h1>Sari-Sari Store</h1>

        <p>Inventory Management System</p>
      </div>

      <div class="login-error">{{ERROR}}</div>

      <form class="login-form" method="POST" action="/reset-password">
        <label for="new_password"> New Password </label>

        <input
          type="password"
          id="new_password"
          name="new_password"
          placeholder="Enter new password"
          autocomplete="new-password"
          required
        />

        <label for="confirm_password"> Confirm Password </label>

        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Confirm new password"
          autocomplete="new-password"
          required
        />

        <input type="hidden" name="username" value="{{USERNAME}}" />

        <input type="hidden" name="pin" value="{{PIN}}" />

        <button type="submit" class="login-button">Reset Password</button>
      </form>

      <div style="text-align: center; margin-top: 18px">
        <a
          href="/login"
          style="color: #3b82f6; text-decoration: none; font-size: 13px"
        >
          Back to Login
        </a>
      </div>

      <div class="login-footer">Password Recovery</div>
    </div>
  </body>
</html>
