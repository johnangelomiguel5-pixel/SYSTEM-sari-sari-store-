<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Reset Password - Sari-Sari Store</title>

    <link rel="stylesheet" href="/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="login-page">
    <div class="login-container">
      <div class="login-brand">
        <div class="login-icon">S</div>

        <h1>Sari-Sari Store</h1>

        <p>Choose a new password</p>
      </div>

      <div class="login-error">{{ERROR}}</div>

      <form class="login-form" method="POST" action="/reset-password">
        <label for="new_password">New Password</label>

        <input
          type="password"
          id="new_password"
          name="new_password"
          placeholder="Enter new password"
          autocomplete="new-password"
          minlength="16"
          maxlength="128"
          required
        />

        <label for="confirm_password">Confirm Password</label>

        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Confirm new password"
          autocomplete="new-password"
          minlength="16"
          maxlength="128"
          required
        />

        <input type="hidden" name="token" value="{{TOKEN}}" />

        <ul class="pw-rules">
          <li>At least 16 characters</li>
          <li>An uppercase letter (A-Z) and a lowercase letter (a-z)</li>
          <li>A number (0-9)</li>
          <li>A special character such as ! @ # $ % ^ &amp; *</li>
        </ul>

        <button type="submit" class="login-button">Reset Password</button>
      </form>

      <div class="center-links">
        <a href="/login">Back to Login</a>
      </div>

      <div class="login-footer">Password Recovery</div>
    </div>
  </body>
</html>
